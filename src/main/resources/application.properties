spring.application.name=crud
# URL de ta base de données PostgreSQL locale (remplace 'mon_db_name' par le nom de ta BDD)
spring.datasource.url=jdbc:postgresql://localhost:5432/springboot
spring.datasource.username=postgres
spring.datasource.password=

# Donne l'ordre à Hibernate de créer automatiquement tes tables en base s'il elles n'existent pas
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL générées par Spring Data JPA dans ton terminal (pratique pour le dev)
spring.jpa.show-sql=true
